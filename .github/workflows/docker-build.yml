name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: release
        run: |
          tag=$(gh api /repos/fiso64/sockseek/releases/latest --jq .tag_name)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SOCKSEEK_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/sockseek:latest
            ${{ vars.DOCKERHUB_USERNAME }}/sockseek:${{ steps.release.outputs.version }}
